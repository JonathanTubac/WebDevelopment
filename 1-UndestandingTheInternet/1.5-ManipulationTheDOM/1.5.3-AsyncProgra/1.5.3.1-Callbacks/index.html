<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="popup-container none">
      <div class="popup">
        <div class="close-popup">
          <button class="close-popup">X</button>
        </div>
        <div class="popup-header">
          <h2>Bienvenido</h2>
        </div>
        <div class="popup-body">
          <p>
            Lorem ipsum dolor sit amet consectetur, adipisicing elit. Velit quam
            ullam vel! Est quam, explicabo consectetur at quae molestiae rem
            molestias necessitatibus! Facere totam rerum commodi expedita ad
            dolor consectetur?
          </p>
        </div>
      </div>
    </div>

    <div class="counter-container">
      <h1>Ingresa el tiempo de tu contador</h1>
      <div class="input-container">
        <input class="time-input" type="number" placeholder="Ingresa la cantidad de tiempo" min="0"/>
        <select name="" id="" class="type-time">
          <option value="sec">segundos</option>
          <option value="min">minutos</option>
          <option value="hour">Horas</option>
        </select>
      </div>
      <button class="start">Iniciar</button>
      <button class="pause">Pausar</button>
      <button class="continue">Reanudar</button>
      <progress value="0"></progress>
    </div>
