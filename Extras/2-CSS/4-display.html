<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display property</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: black;
            height: 100vh;
            width: 100%;
        }

        div {
            width: 250px;
            height: 250px;
            margin: 10px;
            display: block;
        }

        .blue {
            background-color: blue;
            position: absolute;

        }

        .red {
            background-color: red;
        }

        .yellow {
            background-color: yellow;
            position: absolute;
        }

        .blue-inside {
            width: 100px;
            height: 100px;
            background-color: aqua;
            position: absolute;
        }
    </style>
</head>
<body>
    <div class="red"></div>
    <div class="blue">
        <div class="blue-inside"></div>
    </div>
    <div class="yellow"></div>
</body>
</html>
