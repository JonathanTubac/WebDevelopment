<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex</title>
    <style>
      body {
        margin: 0;
        color: white;
      }

      .square {
        width: 250px;
        height: 150px;
        background-color: red;
        flex-shrink: 0.8;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .red {
        background-color: red;
        order: 1;
      }

      .green {
        background-color: green;
        order: 0;
      }

      .black {
        background-color: black;
        order: 2;
      }

      .container {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-content: center;
        flex-wrap: wrap;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="square red">CUADRO ROJO</div>
      <div class="square green">CUADRO VERDE</div>
      <div class="square green">CUADRO VERDE</div>
      <div class="square black">CUADRO NEGRO</div>
    </div>
  </body>
</html>
